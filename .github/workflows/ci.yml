name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: desiconnect
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/desiconnect?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/desiconnect_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret-that-is-long-enough-for-hs256-signing
      AUTH_MODE: local
      CORS_ORIGINS: http://localhost:3000
      API_URL: http://localhost:4000/api/v1
      SEED_DEMO: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit + API integration tests (Vitest, Jest, Supertest against PostGIS)
        run: pnpm test
      - name: Migrate and seed the app database
        run: pnpm db:migrate && pnpm db:seed
      - name: Install Playwright browser
        run: pnpm --filter @desiconnect/e2e exec playwright install --with-deps chromium
      - name: End-to-end tests (Playwright)
        env:
          E2E_START_SERVERS: "1"
          DISABLE_RATE_LIMIT: "true"
        run: pnpm test:e2e
      - name: End-to-end tests in OIDC mode (local dev provider)
        env:
          E2E_START_SERVERS: "1"
          E2E_AUTH_MODE: oidc
          DISABLE_RATE_LIMIT: "true"
          AUTH_MODE: oidc
          OIDC_ISSUER: http://localhost:4400
          OIDC_AUDIENCE: https://api.desiconnect.local
          OIDC_CLIENT_IDS: desiconnect-web,desiconnect-mobile
          OIDC_CLIENT_ID: desiconnect-web
          OIDC_SCOPES: openid profile email offline_access api
          OIDC_ALLOW_INSECURE: "true"
          OIDC_DEV_ACCESS_TTL: "65"
          APP_URL: http://localhost:3000
        run: pnpm test:e2e --project=desktop specs/oidc.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infrastructure/docker/api.Dockerfile --target runtime -t desiconnect-api:${{ github.sha }} .
      - run: docker build -f infrastructure/docker/api.Dockerfile --target migrate -t desiconnect-migrate:${{ github.sha }} .
      - run: docker build -f infrastructure/docker/web.Dockerfile -t desiconnect-web:${{ github.sha }} .
