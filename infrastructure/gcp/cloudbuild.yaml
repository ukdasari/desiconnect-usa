# Builds the three images from one source upload. Run by deploy.sh:
#   gcloud builds submit --config infrastructure/gcp/cloudbuild.yaml --substitutions _REGISTRY=...,_TAG=...
# api     — NestJS API (runtime stage)
# migrate — prisma migrate deploy + reference/restaurant seed (migrate stage of the same Dockerfile)
# web     — Next.js standalone server
steps:
  - id: api
    name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "infrastructure/docker/api.Dockerfile", "--target", "runtime", "-t", "${_REGISTRY}/api:${_TAG}", "."]
  - id: migrate
    name: gcr.io/cloud-builders/docker
    waitFor: ["api"] # reuses the cached build stage
    args: ["build", "-f", "infrastructure/docker/api.Dockerfile", "--target", "migrate", "-t", "${_REGISTRY}/migrate:${_TAG}", "."]
  - id: web
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args: ["build", "-f", "infrastructure/docker/web.Dockerfile", "-t", "${_REGISTRY}/web:${_TAG}", "."]
images:
  - "${_REGISTRY}/api:${_TAG}"
  - "${_REGISTRY}/migrate:${_TAG}"
  - "${_REGISTRY}/web:${_TAG}"
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
